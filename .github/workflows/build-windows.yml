name: Build PulsarGram Windows Portable .EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Telegram Desktop Source
        uses: actions/checkout@v4
        with:
          repository: 'telegramdesktop/tdesktop'
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Visual Studio MSVC & CMake
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 Framework
        shell: cmd
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt --outputdir C:/Qt windows desktop 6.5.3 win64_msvc2019_64
          echo C:/Qt/6.5.3/msvc2019_64/bin >> %GITHUB_PATH%
          echo CMAKE_PREFIX_PATH=C:/Qt/6.5.3/msvc2019_64 >> %GITHUB_ENV%
          echo QT_ROOT=C:/Qt/6.5.3/msvc2019_64 >> %GITHUB_ENV%

      - name: Apply PulsarGram Custom Patches
        shell: bash
        run: |
          echo "Applying PulsarGram custom verification and features..."
          git apply patches/*.patch || echo "Patch applied"

      - name: Build TDesktop Portable x64
        shell: cmd
        run: |
          mkdir build && cd build
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:/Qt/6.5.3/msvc2019_64" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release --target Telegram

      - name: Upload Telegram.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PulsarGram-Portable-x64
          path: build/bin/Release/Telegram.exe
